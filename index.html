<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Конфигуратор</title>
<style>
:root{--bg:#0b1018;--p:#111927;--p2:#172234;--ln:#26344a;--tx:#e8eef8;--mu:#91a0b7;--bl:#4f8cff;--gn:#35c77b;--rd:#f0646a;--pu:#9b7bff;--ctrl-h:32px}
html[data-theme="light"]{--bg:#eef2f7;--p:#ffffff;--p2:#f3f6fb;--ln:#d5dde8;--tx:#1a2332;--mu:#5d6f86;--bl:#2f6fed;--gn:#1fa05a;--rd:#d6454f;--pu:#6f56d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,"Segoe UI",sans-serif;overflow:hidden}
*{scrollbar-width:thin;scrollbar-color:#243548 transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#243548;border-radius:99px}
*::-webkit-scrollbar-thumb:hover{background:#334860}
button,input,select{font:inherit;color:var(--tx)}button{cursor:pointer}
:root{--rail-w:112px;--rail-w-narrow:52px;--rail-item-h:52px;--gut:8px;--hd-h:56px}
.app{height:100vh;display:grid;grid-template-rows:minmax(0,1fr) 48px}
header{grid-area:hd;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--p);border-bottom:1px solid var(--ln);min-width:0;height:var(--hd-h);box-sizing:border-box}
.rail{width:var(--rail-w);flex:none;display:flex;flex-direction:column;min-height:0;padding:0;background:var(--p);border-right:1px solid var(--ln);overflow:hidden;transition:width .24s ease;box-sizing:border-box}
.ws.rail-col .rail{width:var(--rail-w-narrow)}
.rail-tg{flex:none;display:grid;place-items:center;width:32px;height:32px;margin:0 2px 0 0;border:0;border-radius:8px;background:0;color:var(--mu);padding:0;cursor:pointer;transition:color .12s,background .12s}
.rail-tg:hover{color:var(--tx);background:#172234}
.rail-tg:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
.rail-tg .ici{line-height:0;opacity:.92}
.rail-tg .ici .ic-svg{width:20px;height:20px;display:block}
html[data-theme="light"] .rail-tg:hover{background:#eef4fc}
.rail-tabs{display:flex;flex-direction:column;gap:4px;flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:var(--gut);box-sizing:border-box}
.rail-tabs::-webkit-scrollbar{display:none}
.asw{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:var(--rail-item-h);flex:none;border:0;background:0;color:var(--mu);padding:0 2px;border-radius:8px;white-space:nowrap;font-size:11.5px;font-weight:500;line-height:1.15;text-align:center;transition:color .12s,background .12s}
.asw .ici{flex:none;line-height:0;opacity:.9}
.asw .ici .ic-svg{width:20px;height:20px;display:block}
.asw-lb{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ws.rail-col .asw-lb{display:none}
.asw-bottom{margin-top:auto}
.asw:hover:not(.on){color:var(--tx);background:#172234}
.asw.on{color:#fff;font-weight:600;background:#1a2d4d}
.asw.on .ici{opacity:1}
html[data-theme="light"] .asw.on{color:#1a3a7a;background:#e8f0ff}
html[data-theme="light"] .asw:hover:not(.on){background:#eef4fc}
.hr-tools{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.hchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ln);background:var(--p2);border-radius:8px;padding:6px 11px;color:var(--tx);font-size:12px;font-weight:600;white-space:nowrap;line-height:1}
.hchip .hic{display:inline-flex;opacity:.95;line-height:0}
.hchip:hover{border-color:#3f6fac;background:#162945}
.hchip.on{border-color:#3f6fac;background:#1a2d4d;color:#fff;box-shadow:inset 0 0 0 1px #456fa8}
.hload{display:inline-flex;align-items:baseline;gap:8px;padding:6px 8px;border-radius:8px;background:#0e1622;border:1px solid var(--ln);font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2;cursor:default;box-sizing:border-box}
.hload .hmet{display:inline-flex;align-items:baseline;gap:.3em}
.hload .hlab{font-weight:500;margin:0}
.hload b{color:var(--tx);font-weight:500;margin:0}
.hload[hidden]{display:none!important}
.hload .hsrv{width:6.5rem;flex:none;overflow:hidden;text-overflow:ellipsis;color:#7f92ab;font-size:11px;margin-left:2px;padding-left:10px;border-left:1px solid #2a374b;box-sizing:border-box}
html[data-theme="light"] .nav.on{background:transparent;color:#1a2332}
html[data-theme="light"] .hchip.on{background:#e8f0ff;color:#1a3a7a;box-shadow:inset 0 0 0 1px #b7cff5}
html[data-theme="light"] .hchip:hover{background:#eef4fc;border-color:#b7cff5}
html[data-theme="light"] .hload{background:#f7f9fc}
html[data-theme="light"] .hload .hsrv{border-left-color:#d5dde8}
html[data-theme="light"] .ubtn:hover,html[data-theme="light"] .ubtn.on{background:#e8f0ff;border-color:#b7cff5}
html[data-theme="light"] .uav{background:#dce6f5;color:#3a4d66}
html[data-theme="light"] .usign{border-color:#e0a0a6;color:#b33a44}
html[data-theme="light"] .usign:hover{background:#fdecee}
.umenu{position:relative;flex:none}
.ubtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--p2);border-radius:999px;padding:4px 10px 4px 4px;color:var(--tx);cursor:pointer}
.ubtn:hover,.ubtn.on{border-color:#3f6fac;background:#162945}
.uav{width:26px;height:26px;border-radius:50%;background:#2a3b55;display:grid;place-items:center;font-size:13px;flex:none;color:#c5d4ea}
.uname{font-size:13px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.uchev{font-size:10px;color:var(--mu)}
.upop{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:50;width:240px;background:var(--p);border:1px solid var(--ln);border-radius:12px;box-shadow:0 14px 36px #000a;padding:12px;flex-direction:column;gap:10px}
.upop.open{display:flex}
.uhead{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.uhead .uav{width:34px;height:34px;font-size:15px}
.uhead b{font-size:14px}
.upop label{display:block;font-size:12px;color:var(--mu);margin:0}
.upop label select{margin-top:4px}
.usign{margin-top:2px;width:100%;border:1px solid #7a3a42;background:transparent;color:#ff9ca1;border-radius:8px;padding:8px 10px}
.usign:hover{background:#3a1d25}
.ws{min-height:0;display:grid;grid-template-columns:max-content var(--aw,360px) 4px minmax(0,1fr);grid-template-rows:var(--hd-h) minmax(0,1fr);grid-template-areas:"hd hd hd hd" "rail aside rsz main"}
#rail{grid-area:rail}#aside{grid-area:aside}.rsz{grid-area:rsz}#main{grid-area:main}
.ws.one{grid-template-columns:max-content minmax(0,1fr);grid-template-areas:"hd hd" "rail main"}.ws.one .rsz,.ws.one #aside{display:none}
aside,main{min-height:0;overflow:hidden}aside{background:#0b1018;border-right:1px solid var(--ln);display:flex;flex-direction:column}
.rsz{width:4px;cursor:col-resize;background:transparent;position:relative;z-index:2}
.rsz:hover,.rsz.on{background:var(--bl)}
.box{padding:4px 8px;border-bottom:1px solid var(--ln);flex:none}
.srch{display:flex;gap:4px}.srch input{flex:1;height:var(--ctrl-h);padding:0 10px;font-size:13px;box-sizing:border-box}
.srch .btn{padding:0 10px;height:var(--ctrl-h);flex:none;box-sizing:border-box}
.filt{display:grid;grid-template-columns:1.35fr 1.2fr 1fr;gap:4px;margin-bottom:4px}
.view-sw{display:flex;flex:none;gap:2px;padding:10px 8px 0;margin:0;border:0;border-radius:0;background:#0b1018}
.view-sw .fchip{flex:1 1 0;min-width:0;border:0;border-radius:8px;background:transparent;color:var(--mu);min-height:32px;padding:6px 10px;font-size:12px;line-height:1.2;text-align:center;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:background .12s,color .12s}
.view-sw .fchip .ici{flex:none;line-height:0;opacity:.92}
.view-sw .fchip .ici .ic-svg{width:15px;height:15px;display:block}
.view-sw .fchip span{flex:none;white-space:normal;text-align:center}
.view-sw .fchip:hover:not(.on){color:var(--tx);background:#172234}
.view-sw .fchip.on{color:#fff;background:#1a2d4d}
.gear-body{flex:1;display:flex;flex-direction:column;min-height:0;background:#0b1018}
.gear-tree-head{flex:none;padding:8px 8px 6px}
.gear-tree-head .sq{min-height:28px;border-radius:6px;background:#0b1018;border:1px solid transparent;box-shadow:none;transition:background .12s,border-color .12s,box-shadow .12s}
.gear-tree-head .sq:hover{background:#152232}
.gear-tree-head .sq:focus-within{border-color:#4a7ab8;background:#0b1018;box-shadow:0 0 0 1px #2a4a7855}
.gear-tree-head .sq-menu{border-left:0;transition:background .12s,color .12s}
.gear-tree-head .sq-menu:hover,.gear-tree-head .sq-menu.on{background:#152030}
.fchip{border:1px solid var(--ln);background:var(--p2);color:var(--mu);min-height:var(--ctrl-h);padding:0 8px;border-radius:6px;font-size:11px;line-height:1.2;text-align:center;font-weight:600;display:flex;align-items:center;justify-content:center}
.fchip.on{color:#fff;border-color:#3f6fac;background:#162945}
.sq-wrap{position:relative;margin-top:0}
.sq{display:flex;align-items:stretch;border:1px solid #1e2d42;border-radius:8px;background:#0a1018;overflow:hidden;min-height:var(--ctrl-h);box-shadow:inset 0 1px 3px #0009}
.sq:focus-within{border-color:#4a7ab8;box-shadow:inset 0 1px 3px #0009,0 0 0 2px #2a4a7833}
.sq-lead{flex:none;display:inline-flex;align-items:center;padding:0 0 0 10px;color:#5c7390;pointer-events:none}
.sq-lead svg,.sq-menu svg{width:14px;height:14px;display:block;opacity:.9}
.sq > input{flex:1;min-width:0;width:auto;height:auto;align-self:stretch;padding:0 8px 0 4px;font-size:13px;box-sizing:border-box;border:0;border-radius:0;background:transparent;outline:0;box-shadow:none;appearance:none;-webkit-appearance:none;color:var(--tx)}
.sq > input::placeholder{color:#5f738a}
.sq-clear{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;border:0;background:transparent;color:var(--mu);padding:0;cursor:pointer;font-size:14px;line-height:1}
.sq-clear:hover{color:#fff}
.sq-clear.hide{display:none}
.dev-sq-wrap .sq{align-items:center}
.sq-focus-wrap{flex:none;display:flex;align-items:center;padding:3px 2px 3px 6px}
.sq-focus-wrap.sq-filt-wrap{padding:3px 6px 3px 2px}
.sq-focus-wrap.is-reserved,.dev-bulk-act.is-reserved{visibility:hidden;pointer-events:none}
.sq-focus{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:0;border-radius:5px;background:transparent;color:#5c7390;cursor:pointer;padding:0;flex:none;box-sizing:border-box}
.sq-focus:hover:not(.on):not(.hot){color:var(--tx);background:#152030}
.sq-focus.on,.sq-focus.hot{color:#9ec8ff;background:#1a3150}
.sq-focus.on:hover,.sq-focus.hot:hover{color:#9ec8ff;background:#1f3a5c}
.sq-focus svg{width:18px;height:18px;display:block}
html[data-theme="light"] .sq-focus{background:transparent;color:#6b8199}
html[data-theme="light"] .sq-focus:hover:not(.on):not(.hot){background:#e7effa;color:#1a3358}
html[data-theme="light"] .sq-focus.on,html[data-theme="light"] .sq-focus.hot{background:#dce8f7;color:#2f5fad}
html[data-theme="light"] .sq-focus.on:hover,html[data-theme="light"] .sq-focus.hot:hover{background:#c4d8f4;color:#1a3358}
.sq-menu{position:relative;flex:none;display:inline-flex;align-items:center;align-self:stretch;justify-content:center;border:0;border-left:1px solid #243448;background:transparent;color:#5c7390;padding:0;width:36px;cursor:pointer}
.sq-menu:hover,.sq-menu.on{background:#152030;color:#9ec8ff}
.sq-menu.hot{color:#9ec8ff}
.sq-menu.hot:after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--bl)}
.filt-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.filt-tags:empty{display:none;margin:0}
.ftag{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:2px 6px;border-radius:4px;background:#1a3a5c;border:1px solid #2f5f8f;color:#c5dcff;font-size:10px}
.ftag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftag button{border:0;background:0;color:#9ec0e8;padding:0;line-height:1;cursor:pointer;font-size:11px}
.filt-pop{display:none;position:fixed;z-index:40;width:min(312px,calc(100vw - 24px));max-height:min(560px,82vh);background:var(--p);border:1px solid var(--ln);border-radius:8px;box-shadow:0 12px 32px #000a;padding:0;flex-direction:column;overflow:hidden}
.filt-pop.open{display:flex}
.filt-sec{display:flex;flex-direction:column;flex:none;min-height:0;border-bottom:1px solid #2a3a52;background:#0e1622}
.filt-sec+.filt-sec{background:#111a28}
.filt-sec.extra{background:#0c141f;flex:none;margin-top:auto;border-bottom:0;border-top:1px solid #2a3a52}
.filt-sec.types{min-height:0;flex:1 1 auto;overflow:hidden}
.filt-sec.types.expanded{flex:1 1 auto;overflow:hidden}
.filt-sec .sec{flex:none;padding:8px 10px 4px;font-size:10px;color:#a8b8d0;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid #1c2838}
.filt-sec.chips{display:grid;grid-template-columns:5.8em 1fr;align-items:start;column-gap:8px;padding:8px 10px;border-bottom:1px solid #2a3a52}
.filt-sec.chips .sec{padding:5px 0 0;border:0;line-height:1.25;white-space:normal}
.filt-sec.chips .filt-status{padding:0;min-width:0}
.filt-sec.fields.chips{border-bottom:1px solid #3a4d66}
.filt-sec.status.chips{border-bottom:1px solid #3a4d66}
.filt-sec.types.chips{border-bottom:1px solid #2a3a52}
.filt-sec.types.chips .filt-more{grid-column:1/-1;padding:2px 0 0}
.filt-sec.types.chips.expanded .filt-status{max-height:min(180px,32vh);overflow:auto;scrollbar-width:thin;scrollbar-color:#3a4d66 transparent}
.filt-sec-body{overflow:hidden;padding:2px 4px;min-height:0}
.filt-sec.types.expanded .filt-sec-body{overflow:auto;flex:1 1 auto;max-height:min(220px,36vh);scrollbar-width:thin;scrollbar-color:#3a4d66 transparent}
.filt-sec.types.expanded .filt-sec-body::-webkit-scrollbar{width:5px}
.filt-sec.types.expanded .filt-sec-body::-webkit-scrollbar-track{background:transparent}
.filt-sec.types.expanded .filt-sec-body::-webkit-scrollbar-thumb{background:#3a4d66;border-radius:99px}
.filt-sec.types.expanded .filt-sec-body::-webkit-scrollbar-thumb:hover{background:#4d6482}
.filt-more{display:flex;align-items:center;gap:6px;width:100%;padding:2px 10px 6px;border:0;background:0;color:#7aa2d4;font-size:11px;cursor:pointer;text-align:left;flex:none}
.filt-more:hover{color:#b7d2f5}
.filt-more .chev{font-size:10px;opacity:.75}
.filt-sec.fields{background:#0e1622}
.filt-status{display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px 8px}
.stchip-ic{flex:none;display:inline-flex;align-items:center;padding:0 0 0 7px;line-height:0;opacity:.9}
.stchip-ic .ic-svg,.stchip-ic .ici .ic-svg{width:11px;height:11px}
.stchip.has-ic .stchip-lab{padding-left:5px}
.stchip{display:inline-flex;align-items:center;gap:0;border:1px solid #2a3d55;background:#152030;color:#9aacbf;border-radius:99px;padding:0;font-size:11px;font-weight:600;line-height:1.3;cursor:pointer;overflow:hidden}
.stchip-lab{border:0;background:0;color:inherit;font:inherit;font-weight:600;padding:4px 9px;cursor:pointer;line-height:1.3}
.stchip.has-eye .stchip-lab{padding-right:4px}
.stchip-eye{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:0 3px 0 0;padding:0;border:0;border-radius:99px;background:transparent;color:inherit;opacity:.45;cursor:pointer;line-height:0}
.stchip-eye svg{width:12px;height:12px;display:block}
.stchip-eye:hover{opacity:.95;background:#ffffff14}
.stchip-eye.on{opacity:1;color:#9ec8ff;background:#ffffff12}
.stchip:hover{color:#e8eef8;border-color:#3d628f;background:#1a2d44}
.stchip.on{color:#fff;background:#1a3a5c;border-color:#3f6fac}
.stchip:disabled,.stchip.dis{opacity:.38;cursor:not-allowed;color:#6d7d90;border-color:#243446;background:#121c28}
.stchip:disabled:hover,.stchip.dis:hover{color:#6d7d90;border-color:#243446;background:#121c28}
.stchip.on-nosignal{background:#3a1d25;border-color:#7a3a42;color:#ff9ca1}
.stchip.on-license{background:#3a3220;border-color:#7a6a3a;color:#e6c86a}
.filt-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 8px}
.filt-foot .mi{width:auto!important;flex:none}
.filt-foot .btn{flex:none;white-space:nowrap}
.filt-pop .mi{display:flex;align-items:center;gap:4px;width:100%;padding:2px 4px 2px 6px;border:0;background:0;color:var(--tx);font-size:12px;line-height:1.25;text-align:left;border-radius:4px}
.filt-pop .mi:hover{background:#172a46}
.filt-pop .mi.on{background:#1a2d4d}
.filt-pop .mi-lab{display:flex;align-items:center;gap:6px;flex:1;min-width:0;cursor:pointer;padding:1px 0}
.filt-pop .mi input{width:auto;margin:0;accent-color:var(--bl);flex:none;transform:scale(.9)}
.filt-pop .mi .ic{width:12px;flex:none;opacity:.85;text-align:center;font-size:11px}
.filt-pop .mi span.lbl{flex:1;min-width:0}
.filt-pop .mi-eye{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;border:0;border-radius:4px;background:transparent;color:#5a6f8a;cursor:pointer;line-height:0}
.filt-pop .mi-eye svg{width:14px;height:14px;display:block}
.filt-pop .mi-eye:hover{color:#c5dcff;background:#1a2d4d}
.filt-pop .mi-eye.on{color:#9ec8ff;background:#1a2d4d}
.filt-hint{font-size:10px;color:var(--mu);margin-top:3px}
.filt-hint:empty{display:none;margin:0}
.tree{flex:1;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#2f3f55 transparent}
.tree::-webkit-scrollbar{width:6px}
.tree::-webkit-scrollbar-track{background:transparent}
.tree::-webkit-scrollbar-thumb{background:#2f3f55;border-radius:99px}
.tree::-webkit-scrollbar-thumb:hover{background:#3d536e}
.n{display:flex;align-items:center;flex-wrap:nowrap;gap:5px;height:28px;padding:0 6px 0 8px;border-left:3px solid transparent;cursor:pointer;color:#c7d1e0;font-size:12px;user-select:none;min-width:0}
.n .tw{display:inline-flex;align-items:center;justify-content:center;width:11px;flex:none;cursor:pointer;user-select:none}
.n:hover{background:#142033}.n.on{background:#152232;border-left-color:var(--bl);color:#e8eef8}.n.mark{background:#15263c;border-left-color:#3d6a9e;color:#e8eef8}.n.on.mark{background:#182a3a;border-left-color:var(--bl);color:#fff}
.n.off .nm,.n.off .nm-inp{color:#8a96a8}
.n.off .ici>.ic-svg{opacity:.55}
.n-add{color:var(--bl);font-weight:600;font-size:12px}.n-add:hover{background:#162945;color:#9ec8ff}.n-add .nm{color:inherit}
.lk-add{border:0;background:0;color:var(--bl);font-weight:600;font-size:inherit;padding:0;cursor:pointer;text-align:left;font-family:inherit}
.lk-add:hover{color:#9ec8ff}
.n-empty{padding-left:22px;height:24px;color:var(--mu);font-size:11px;font-style:italic;cursor:default}
.n-empty:hover{background:transparent}
.n-add.srv{font-weight:600;font-size:12px}
.tctx{display:none;position:fixed;z-index:45;min-width:220px;max-height:min(70vh,420px);overflow:auto;background:var(--p);border:1px solid var(--ln);border-radius:8px;box-shadow:0 10px 28px #000a;padding:4px 0;scrollbar-width:thin;scrollbar-color:#2f3f55 transparent}
.tctx.open{display:block}
.tctx button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:0;color:var(--tx);padding:7px 10px 7px 8px;font-size:12px;text-align:left;cursor:pointer}
.tctx button:hover{background:#172a46}
.tctx button:disabled{opacity:.42;cursor:default}

  const html=`<label style="display:block;font-size:12px;color:var(--mu);margin-bottom:4px">${i18n("Название")}</label><input id="newGroupName" type="text" value="${escHtml(def)}" autocomplete="off" style="width:100%;height:var(--ctrl-h);padding:0 10px;box-sizing:border-box;border-radius:6px;border:1px solid var(--ln);background:var(--p2);color:var(--tx)" onkeydown="if(event.key==='Enter'){event.preventDefault();runConfirmOk()}">`;
  askConfirm("Новая группа",html,"","Создать",()=>{
    let name=(document.getElementById("newGroupName")?.value||"").trim();
    if(!name)name=def;
    if(groups.some(g=>g.name===name)){toast(i18n("Группа с таким именем уже есть"));return;}
    const id="g"+Date.now();
    groups.push({id,name,cams:[]});
    grp=id;open.add(id);tab="gen";setD(true);paint();
  },{html:true,rawMsg:true});
  setTimeout(()=>{const el=document.getElementById("newGroupName");el?.focus();el?.select();},0);
}

function pick(id,opts){
  if(treeRenameId&&treeRenameId!==id){
    const el=document.querySelector(".nm-inp");
    if(el)commitTreeRename(treeRenameId,el.value);
  }
  closeTreeCtx();
  const f=find(id);if(!f)return;
  const range=!!opts?.range,additive=!!opts?.additive,multi=range||additive;
  if(range&&canMultiPick(f.n)){
    const ids=visibleMultiIds();
    if(!treeAnchor||!ids.includes(treeAnchor))treeAnchor=ids.includes(sel)?sel:id;
    applyShiftRange(id);
  }else if(additive&&canMultiPick(f.n)){
    const ids=visibleMultiIds();
    if(!treeSel.size&&ids.includes(sel))treeSel.add(sel);
    if(treeSel.has(id)&&treeSel.size>1)treeSel.delete(id);
    else treeSel.add(id);
    treeAnchor=id;
  }else resetTreeSel(id);
  pushRecent(id);sel=id;tab="gen";setD(false);expandTo(id);
  if(multi&&canMultiPick(f.n)){renderTree();gear();return}
  paint();
}

function card(title,b,x=""){return `<div class="card"><div class="ch">${i18n(title)}${x}</div><div class="cb">${b}</div></div>`}
function bdg(n){
  // Домен / сервер — только сигнал
  if(isSignalOnly(n)){
    const ok=n.online!==false;
    return `<span class="bd ${ok?"":"off"}">${ok?i18n("Есть сигнал"):infraNoSignalLabel(n)}</span>`;
  }
  const st=nodeStatus(n),bits=[];
  if(st.ruleOff)bits.push(i18n("Отключено по правилу"));
  else bits.push(st.on?i18n("Включен"):i18n("Выключен"));
  if(st.nosignal)bits.push(i18n("нет сигнала"));
  else if(st.on)bits.push(i18n("есть сигнал"));
  if(st.license)bits.push(i18n("лицензия превышена"));
  const bad=st.off||st.nosignal||st.license;
  return `<span class="bd ${bad?"off":""}">${bits.join(" · ")}</span>`;
}

function vis(n,q){
  if(n.type==="det")return false;
  const key=tview+"|"+filtKey()+"|"+q+"|"+n.id;if(searchMatchCache.has(key))return searchMatchCache.get(key);
  const hit=selfInView(n)&&matchesSearch(n,q)||kids(n).some(k=>vis(k,q));
  searchMatchCache.set(key,hit);return hit;
}

function toggleNode(id,e){e.stopPropagation();if(open.has(id))open.delete(id);else open.add(id);renderTree()}

function treeNodeHasKids(n){
  if(n.type==="unalloc")return true;
  if(n.type==="domain")return !hasNoSignal(n);
  if(n.type==="server")return !isUnallocated(n.id)&&!hasNoSignal(n);
  return treeKids(n).length>0;
}

  const fn={dom:"toggleDom",srv:"toggleSrv",node:"toggleNode"}[kind]||"toggleNode";

function treeDblToggle(id,kind,e){

function bindTreeDbl(){
  const treeEl=document.getElementById("tree");
  if(!treeEl||treeEl._dblBound)return;
  treeEl._dblBound=true;
  let treePickTimer=null;
  treeEl.addEventListener("mousedown",e=>{
    if(!(e.shiftKey||e.ctrlKey||e.metaKey))return;
    if(e.target.closest(".tw"))return;
    if(e.target.closest(".n-add"))return;
    if(e.target.closest(".nm-inp"))return;
    const row=e.target.closest(".n[data-pick]");
    if(!row)return;
    const id=row.dataset.pick,f=find(id);
    if(!f||!canMultiPick(f.n))return;
    e.preventDefault();
    clearTimeout(treePickTimer);treePickTimer=null;
    pick(id,{range:e.shiftKey,additive:!e.shiftKey&&(e.ctrlKey||e.metaKey)});
  });
  treeEl.addEventListener("click",e=>{
    if(e.target.closest(".tw"))return;
    if(e.target.closest(".n-add"))return;
    if(e.target.closest(".nm-inp"))return;
    if(e.shiftKey||e.ctrlKey||e.metaKey)return;
    const row=e.target.closest(".n[data-pick]");
    if(!row)return;
    const id=row.dataset.pick;
    clearTimeout(treePickTimer);
    treePickTimer=setTimeout(()=>{treePickTimer=null;pick(id);},250);
  });
  treeEl.addEventListener("dblclick",e=>{
    if(e.target.closest(".tw"))return;
    if(e.target.closest(".n-add"))return;
    if(e.target.closest(".nm-inp"))return;
    clearTimeout(treePickTimer);
    treePickTimer=null;
    const row=e.target.closest(".n[data-pick]");
    if(!row||row.classList.contains("n-add"))return;
    if(row.dataset.tid){
      e.preventDefault();
      treeDblToggle(row.dataset.tid,row.dataset.tkind||"node",e);
    }else pick(row.dataset.pick);
  });
}
function addTreeLabel(n){
  if(!n||n.type==="domain"||n.type==="unalloc")return i18n("Добавить сервер");
  if(tview==="acfa"||n.type==="acfa"||ACFA_NODE_IDS.has(n.id))return i18n("Добавить ACFA");
  if(tview==="sys"||isSvc(n))return i18n("Добавить службу");
  return i18n("Добавить устройство");
}
function canInspectorAdd(n){
  if(!n||n.type==="unalloc"||n.type==="det")return false;
  if(n.type==="domain")return true;
  if(n.type==="server")return !isUnallocated(n.id);
  const s=srv(n.id);
  return s&&s.type==="server"&&!isUnallocated(s.id);
}
function inspectorAddBtn(n){
  if(!canInspectorAdd(n))return"";
  const lb=addTreeLabel(n),act=n.type==="domain"?"openW('server')":"openW()";
  return `<button class="btn s" onclick="${act}">＋ ${lb}</button>`;
}
function canWizardAdd(n){return n&&(n.type==="domain"||n.type==="server")}
function canTreeCtx(n){
  if(!n||n.type==="det")return false;
  if(n.type==="domain"||n.type==="server"||n.type==="unalloc")return true;
  return treeKind(n)===tview;
}
function canTreeCtxAdd(n){
  if(n.type==="domain")return true;
  if(n.type==="server")return !isUnallocated(n.id);
  return false;
}
function canTreeCtxDelete(n){
  if(!n)return false;
  if(n.type==="ipsrv"||n.type==="camera"||n.type==="acfa")return true;
  return isSvc(n);
}
function deleteAllDevices(serverId){
  closeTreeCtx();
  const f=find(serverId);if(!f||f.n.type!=="server"||isUnallocated(serverId))return;
  const n=f.n,count=(n.devices||[]).length;
  if(!count){toast("На сервере нет устройств");return}
  const ids=new Set();
  function collect(list){(list||[]).forEach(x=>{ids.add(x.id);collect(x.devices)})}
  collect(n.devices);
  n.devices=[];
  remakeAcfa();
  groups.forEach(g=>{if(g.cams)g.cams=g.cams.filter(x=>!ids.has(x))});
  ids.forEach(id=>open.delete(id));
  treeMatchCache.clear();searchMatchCache.clear();
  sel=serverId;tab="gen";setD(false);
  toast(count===1?"Устройство удалено":`Удалено устройств: ${count}`);
  paint();
}
function deleteTreeNode(id){
  closeTreeCtx();
  const f=find(id);if(!f||!canTreeCtxDelete(f.n)||!f.p?.devices)return;
  const name=f.n.name,pid=f.p.id;
  removeNodeFromParent(f);
  remakeAcfa();
  groups.forEach(g=>{if(g.cams)g.cams=g.cams.filter(x=>x!==id)});
  treeMatchCache.clear();searchMatchCache.clear();open.delete(id);
  resetTreeSel(pid);sel=pid;tab="gen";setD(false);expandTo(pid);
  toast(name+" удалён");paint();
}
function removeNodeFromParent(f){
  const i=f.p.devices.findIndex(x=>x.id===f.n.id);if(i<0)return false;
  const gone=new Set();
  function collect(n){gone.add(n.id);(n.devices||[]).forEach(collect)}
  collect(f.n);
  f.p.devices.splice(i,1);
  gone.forEach(id=>open.delete(id));
  groups.forEach(g=>{if(g.cams)g.cams=g.cams.filter(x=>!gone.has(x))});
  return true;
}
function clearTreeSel(){
  treeSel.clear();
  const f=find(sel);
  treeAnchor=f&&canMultiPick(f.n)?sel:null;
  renderTree();
}
function deleteSelected(){
  closeTreeCtx();
  const ids=[...treeSel].filter(id=>{const f=find(id);return f&&canMultiPick(f.n)&&f.p?.devices});
  if(!ids.length){toast("Нечего удалять");return}
  const idSet=new Set(ids);
  const roots=ids.filter(id=>{
    const pth=path(id).slice(0,-1);
    return!pth.some(n=>idSet.has(n.id));
  });
  const count=roots.length;
  if(!count){toast("Нечего удалять");return}
  const title=count===1?"Удалить объект?":"Удалить выбранные объекты?";
  const msg=count===1
    ?`${i18n("Будет удалён")} «${find(roots[0])?.n?.name||i18n("объект")}».`
    :`${i18n("Будет удалено объектов:")} ${count}.`;
  askConfirm(title,msg,"Это действие нельзя отменить.","Удалить",()=>{
    roots.forEach(id=>{
      const f=find(id);if(!f||!f.p?.devices)return;
      removeNodeFromParent(f);
    });
    remakeAcfa();treeMatchCache.clear();searchMatchCache.clear();
    const pid=find(sel)?.p?.id||sel;
    resetTreeSel(pid);sel=pid;tab="gen";setD(false);expandTo(pid);
    toast(count===1?"Устройство удалено":`Удалено устройств: ${count}`);
    paint();
  });
}

function treeGearChildNodes(n){
  if(n.type==="domain"){
    const kids=[...(n.servers||[])];
    if((n.unallocServers||[]).length)kids.push(unallocNode(n));
    return kids;
  }
  if(n.type==="unalloc"){
    const d=domains.find(x=>x.id===n.domainId);
    return d?.unallocServers||[];
  }
  if(n.type==="server")return(n.devices||[]).filter(d=>d.type!=="det"&&hasTreeIn(d));
  return treeKids(n);
}
function treeDescendantIds(n){
  const ids=[];
  function walk(node){
    treeGearChildNodes(node).forEach(k=>{
      if(!k?.id)return;
      ids.push(k.id);
      walk(k);
    });
  }
  walk(n);
  return ids;
}

function openTreeCtx(n,xy){
  const menu=document.getElementById("tctx");if(!menu)return;
  const multi=treeSel.size>1&&treeSel.has(n.id);

  if(multi){
    main.push(tctxItem(`${i18n("Удалить выбранные")} (${treeSel.size})`,`deleteSelected()`));
    main.push(tctxItem(i18n("Снять выделение"),`closeTreeCtx();clearTreeSel()`));
  }else{
    const parts=[];
    if(treeNodeHasKids(n)){
      const expanded=open.has(n.id);
      const tl=expanded?i18n("Свернуть"):i18n("Развернуть");
      parts.push(tctxItem(tl,`closeTreeCtx();treeToggleId('${n.id}')`));
      if(expanded&&canCollapseTreeChildren(n))parts.push(tctxItem(i18n("Свернуть дочерние"),`collapseTreeChildren('${n.id}')`));
    }
    const addItems=[];
    if(n.type==="unalloc"){
      addItems.push(tctxItem(i18n("Добавить в домен"),`closeTreeCtx();openW('server')`,tctxPlusIcon()));
    }else if(canTreeCtxAdd(n)){
      const lb=addTreeLabel(n);
      const act=n.type==="domain"?`closeTreeCtx();openW('server')`:"closeTreeCtx();openW()";
      addItems.push(tctxItem(lb,act,tctxPlusIcon()));
    }
    const rest=[];
    if(n.type==="server"&&isUnallocated(n.id)){
      const did=unallocDomainOf(n.id);
      if(did)rest.push(tctxItem(i18n("Добавить в домен"),`closeTreeCtx();addToDomain('${n.id}','${did}')`));
    }else if(n.type!=="unalloc"){
      const canRename=n.type==="domain"||n.type==="server"||(n.type!=="unalloc"&&n.type!=="det"&&treeKind(n)===tview);
      if(canRename)rest.push(tctxItem(i18n("Переименовать"),`ctxRename('${n.id}')`));
      if(canRenameShort(n))rest.push(tctxItem(i18n("Изменить короткое имя"),`ctxRename('${n.id}','short')`));
      if(n.type==="server"&&!isUnallocated(n.id)&&domainOf(n.id)){
        rest.push(tctxItem(i18n("Исключить из домена"),`closeTreeCtx();excludeFromDomain('${n.id}')`));
        rest.push(tctxItem(i18n("Удалить все устройства"),`deleteAllDevices('${n.id}')`));
      }
    }
    if(n.type==="unalloc")rest.push(tctxItem(i18n("Обновить"),`refreshUnalloc('${n.domainId}')`));
    if(canTreeCtxDelete(n))rest.push(tctxItem(i18n("Удалить"),`deleteTreeNode('${n.id}')`));
    main=[...parts];
    if(addItems.length){
      if(main.length)main.push(tctxSep());
      main.push(...addItems);
    }
    if(rest.length){
      if(main.length)main.push(tctxSep());
      main.push(...rest);
    }
    if(main.length)main.push(tctxSep());
    main.push(tctxItem(i18n("Открыть в новой вкладке"),`ctxOpenNewTab('${n.id}')`,tctxNewTabIcon()));
  }
  menu.innerHTML=main.join("");
  menu.classList.add("open");

  let left=xy.x,top=xy.y;
  if(left+mw>window.innerWidth-pad)left=Math.max(pad,window.innerWidth-mw-pad);
  if(top+mh>window.innerHeight-pad)top=Math.max(pad,xy.y-mh);
  if(top+mh>window.innerHeight-pad)top=Math.max(pad,window.innerHeight-mh-pad);
  menu.style.left=left+"px";
  menu.style.top=top+"px";
}

      rows.push(camRowFromDevice(d,0,{kids:cams.length}));
      if(showIpsrvKids||tblOpen.has(d.id))cams.forEach(c=>rows.push(camRowFromDevice(c,1,{parent:d.id,ipChild:true})));
    }
  });
  return rows;
}
function camsTableMinWidth(){
  return camsColWidths.reduce((a,w)=>a+(w||0),0);
}
function camsColGroupHtml(){

}
function camsColHeadHtml(){

function applyCamsColWidths(){
  const table=document.querySelector("table.gtbl-cams");
  if(!table)return;
  table.querySelectorAll("colgroup col").forEach((col,i)=>{if(camsColWidths[i]!=null)col.style.width=camsColWidths[i]+"px"});
  table.style.minWidth=camsTableMinWidth()+"px";
}
function startCamsColResize(e,col){
  e.preventDefault();e.stopPropagation();
  camsColDrag={col,startX:e.clientX,startW:camsColWidths[col]};
  const h=e.target.closest(".gtbl-col-resize");if(h)h.classList.add("on");
  document.addEventListener("mousemove",onCamsColResize);
  document.addEventListener("mouseup",stopCamsColResize);
  document.body.classList.add("gtbl-col-resizing");
}
function onCamsColResize(e){
  if(!camsColDrag)return;
  const min=44;
  camsColWidths[camsColDrag.col]=Math.max(min,camsColDrag.startW+(e.clientX-camsColDrag.startX));
  applyCamsColWidths();
}
function stopCamsColResize(){
  document.querySelectorAll(".gtbl-col-resize.on").forEach(el=>el.classList.remove("on"));
  camsColDrag=null;
  document.removeEventListener("mousemove",onCamsColResize);
  document.removeEventListener("mouseup",stopCamsColResize);
  document.body.classList.remove("gtbl-col-resizing");
}
function matchCamTblRow(r,filt){
  const cols=[["ip","ip"],["port","port"],["vendor","vendor"],["model","model"],["id","devId"],["lat","lat"],["lon","lon"],["azimuth","azimuth"]];
  if(!cols.every(([fk,rk])=>{const q=(filt[fk]||"").trim().toLowerCase();return!q||String(r[rk]??"").toLowerCase().includes(q)}))return false;
  const nameQ=(filt.name||"").trim().toLowerCase();
  if(nameQ&&!String(r.label??"").toLowerCase().includes(nameQ)&&!String(r.name??"").toLowerCase().includes(nameQ)&&!String(r.short??"").toLowerCase().includes(nameQ))return false;
  return true;
}
function countServerCameras(server){
  let n=0;
  (server.devices||[]).forEach(d=>{
    if(d.type==="camera")n++;
    else if(d.type==="ipsrv")(d.devices||[]).forEach(c=>{if(c.type==="camera")n++});
  });
  return n;
}
function getCamsTableRows(server,opts={}){
  const filt=tblFilt.cams;
  let rows=collectCamRows(server,opts);
  const filtering=Object.keys(filt).some(k=>!!(filt[k]&&String(filt[k]).trim()));
  if(filtering){
    const hit=rows.filter(r=>matchCamTblRow(r,filt));
    const keep=new Set(hit.map(r=>r.id));
    hit.filter(r=>r.parent).forEach(r=>keep.add(r.parent));
    rows=rows.filter(r=>keep.has(r.id));
  }
  return rows;
}
function camsTblCellHtml(r,colKey){
  if(colKey==="name"){
    const tw=r.kind==="ipsrv"?`<span class="tw" onclick="event.stopPropagation();toggleTblOpen('${r.id}',event)">${tblOpen.has(r.id)?"▾":"▸"}</span>`:`<span class="tw"></span>`;
    return `<td class="gtbl-name"><div class="nm-cell">${tw}<span>${ic(r.kind)}</span> <span>${escHtml(r.label)}</span></div></td>`;
  }
  const field=colKey==="id"?"devId":colKey;
  const val=colKey==="id"?r.devId:r[colKey];
  return camTblTd(r,field,val);
}
function csvEscapeCell(v){
  const s=String(v??"");
  if(/[",\n\r]/.test(s))return `"${s.replace(/"/g,'""')}"`;
  return s;
}
function deviceCsvHeaders(){return DEVICE_CSV_SPEC.map(([,label])=>label)}
function resolveGroupIdFromName(name){
  const n=String(name||"").trim();if(!n)return"";
  return groups.find(g=>g.name===n)?.id||"";
}
function deviceCsvObjectFromNode(n,tableRow){
  const ipChild=!!(tableRow&&tableRow.ipChild);
  const archName=arch.find(a=>a.id===n.arch)?.name||"";
  const groupName=groups.find(g=>g.cams?.includes(n.id))?.name||"";
  const connEmpty=ipChild;
  return{
    ip:connEmpty?"":(n.ip||""),
    port:connEmpty?"":String(n.port??""),
    vendor:connEmpty?"":(n.vendor||""),
    model:connEmpty?"":(n.model||""),
    user:n.user||"",
    pass:"",
    identifier:deviceIdentifierValue(n)||"",
    short:n.short??"",
    name:n.name||"",
    lat:n.lat??"",
    lon:n.lon??"",
    azimuth:n.azimuth??"",
    archive:archName,
    record:recordModeLabel(n.rec||"none"),
    group:groupName,
  };
}
function deviceCsvLineFromObject(o){return DEVICE_CSV_SPEC.map(([k])=>csvEscapeCell(o[k]??"")).join(",")}
function buildDeviceCsvText(objects){
  const header=deviceCsvHeaders().map(csvEscapeCell).join(",");
  const body=objects.map(deviceCsvLineFromObject).join("\n");
  return "\uFEFF"+header+(body?"\n"+body:"");
}
function exportCamsTableCsv(){
  const f=find(sel);
  if(!f||f.n.type!=="server")return;
  const server=f.n,rows=getCamsTableRows(server,{expandIpsrv:true});
  if(!rows.length){toast("Нет данных для экспорта");return}
  const objects=rows.map(r=>{const hit=find(r.id);return hit?deviceCsvObjectFromNode(hit.n,r):null}).filter(Boolean);
  const text=buildDeviceCsvText(objects);
  const importable=objects.filter(o=>String(o.ip||"").trim()&&String(o.vendor||"").trim()&&String(o.model||"").trim()).length;
  const safe=(server.name||"server").replace(/[^\w\u0400-\u04FF.-]+/g,"_").slice(0,48);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));
  a.download=`${safe}-cameras.csv`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(`Экспорт: ${objects.length} строк, для импорта: ${importable}`);
}

function collectAcfaRows(server){
  const rows=[];
  function walkAcfa(list,depth){
    (list||[]).forEach(n=>{
      rows.push({id:n.id,name:n.name,short:n.short??"",type:LB[n.type]||n.type,addr:n.ip||"",online:n.online!==false,depth,ntype:n.type});
      walkAcfa(n.devices,depth+1);
    });
  }
  (server.devices||[]).forEach(d=>{
    if(d.type==="acfa"){rows.push({id:d.id,name:d.name,short:d.short??"",type:LB.acfa,addr:d.ip||"",online:d.online!==false,depth:0,ntype:"acfa"});walkAcfa(d.devices,1)}
  });
  return rows;
}

function exactDeviceDuplicate(r){

}

  return configuredDevices().some(n=>n.ip===r.ip&&+(n.port||80)===+(r.port||80)&&(!n.mac||!r.mac||n.mac.toLowerCase()!==r.mac.toLowerCase()));
}
function deviceTemplates(){
  const s=deviceTarget(),out=[];
  if(!s)return out;
  walk(n=>{if(n.type==="camera"&&n.model)out.push(n)},s.devices||[],s);
  return out;
}
function deviceFilterMatch(r,q){
  if([r.ip,r.vendor,r.model,r.name,r.mac].some(v=>String(v||"").toLowerCase().includes(q)))return true;
  if(!r.mac)return false;
  const mq=q.replace(/[^a-f0-9]/gi,"");
  if(mq.length<2)return false;
  return String(r.mac).toLowerCase().replace(/[^a-f0-9]/g,"").includes(mq);
}
function visibleDeviceResults(){
  const q=(wizd.devFilter||"").trim().toLowerCase();
  return wizd.devResults.filter(r=>{
    if((!r.added&&exactDeviceDuplicate(r))||!wizd.devStatuses[r.status])return false;
    return!q||deviceFilterMatch(r,q);
  });
}

function applyBulkEdit(){

  if(!list.length){toast("Выберите устройства");return}
  const b=wizd.bulkEdit;
  const keys=["vendor","model","user","pass","name","arch","group","record"];
  if(!keys.some(k=>b[k]!==""&&b[k]!=null)){toast("Укажите хотя бы один параметр");return}

function splitCsvLine(line){
  const out=[];let cur="",quote=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(c==='"'){quote=!quote;continue}
    if(c==="\\"&&line[i+1]===","){cur+=",";i++;continue}
    if(c===","&&!quote){out.push(cur.trim());cur="";continue}
    cur+=c;
  }
  out.push(cur.trim());return out;
}
function decodeCsvBuffer(buf){
  const b=new Uint8Array(buf);
  if(b.length>=4&&b[0]===0xff&&b[1]===0xfe&&b[2]===0&&b[3]===0){
    const v=new DataView(buf),chars=[];for(let i=4;i+3<b.length;i+=4)chars.push(String.fromCodePoint(v.getUint32(i,true)));return chars.join("");
  }
  if(b.length>=4&&b[0]===0&&b[1]===0&&b[2]===0xfe&&b[3]===0xff){
    const v=new DataView(buf),chars=[];for(let i=4;i+3<b.length;i+=4)chars.push(String.fromCodePoint(v.getUint32(i,false)));return chars.join("");
  }
  return new TextDecoder("utf-8").decode(b).replace(/^\uFEFF/,"");
}
function csvColMapFromHeader(headerCols){
  const map={};
  headerCols.forEach((h,i)=>{const key=CSV_HEADER_TO_KEY[String(h||"").trim().toLowerCase()];if(key!=null&&map[key]==null)map[key]=i});
  return map;
}
function csvPick(cols,map,key,fallback){
  if(map&&map[key]!=null)return cols[map[key]]??"";
  return fallback!=null?cols[fallback]??"":"";
}
function csvRowFrom(cols,index,colMap){
  const legacy=!colMap||colMap.ip==null;
  const ip=legacy?cols[0]:csvPick(cols,colMap,"ip",0);
  const port=legacy?cols[1]:csvPick(cols,colMap,"port",1);
  const vendor=legacy?cols[2]:csvPick(cols,colMap,"vendor",2);
  const model=legacy?cols[3]:csvPick(cols,colMap,"model",3);
  const user=legacy?cols[4]:csvPick(cols,colMap,"user",4);
  const pass=legacy?cols[5]:csvPick(cols,colMap,"pass",5);
  const identifier=legacy?(cols[6]||""):csvPick(cols,colMap,"identifier",6);
  const oldLegacy=legacy&&cols.length<=13&&cols[7]&&!/^-?\d/.test(String(cols[8]||""));
  const shortName=legacy?(oldLegacy?"":(cols[7]||"")):csvPick(cols,colMap,"short",7);
  const name=legacy?((oldLegacy?cols[7]:cols[8])||""):csvPick(cols,colMap,"name",8);
  const lat=legacy?(oldLegacy?cols[8]:cols[9]):csvPick(cols,colMap,"lat",9);
  const lon=legacy?(oldLegacy?cols[9]:cols[10]):csvPick(cols,colMap,"lon",10);
  const azimuth=legacy?(oldLegacy?cols[10]:cols[11]):csvPick(cols,colMap,"azimuth",11);
  const archiveName=legacy?(oldLegacy?cols[11]:cols[12]):csvPick(cols,colMap,"archive",12);
  const recordName=legacy?(oldLegacy?cols[12]:cols[13]):csvPick(cols,colMap,"record",13);
  const groupName=legacy?"":csvPick(cols,colMap,"group");
  const row={id:"csv"+index,ip,port:+port||80,vendor,model,user,pass,identifier,short:shortName,name,lat,lon,azimuth,arch:"",record:"motion",group:"",errors:[],skipImport:false};
  if(!csvRowHasImportRequired(row)){row.skipImport=true;return row;}
  const kind=inferCsvDeviceKind(row);
  if(!row.name)row.name=kind.type==="ipsrv"?(row.model||"IP-сервер"):`Камера ${ip||index}`;
  const errors=row.errors;
  if(vendor&&!DEVICE_MODELS[vendor]&&kind.type!=="ipsrv")errors.push("неизвестный производитель");
  if(vendor&&model&&DEVICE_MODELS[vendor]&&!DEVICE_MODELS[vendor].includes(model)&&kind.type!=="ipsrv")errors.push("неизвестная модель");
  if(identifier&&identifier!=="Авто"&&!/^[A-Za-z0-9_]+$/.test(identifier))errors.push("некорректный ID");
  if(legacy&&cols.length<4)errors.push("недостаточно столбцов");
  const a=arch.find(x=>x.name===archiveName||x.id===archiveName);
  row.arch=a?.id||"";
  const recMap={Нет:"none",Всегда:"always","По движению":"motion",none:"none",always:"always",motion:"motion"};
  row.record=recMap[recordName]||(row.arch?"motion":"none");
  row.group=resolveGroupIdFromName(groupName);
  if(groupName&&!row.group)errors.push("неизвестная группа");
  return row;
}
function parseCsvDeviceRows(text){
  const lines=text.split(/\r?\n/).filter(x=>x.trim());
  if(!lines.length)return[];
  const first=splitCsvLine(lines[0]);
  const colMap=csvColMapFromHeader(first);
  const hasHeader=colMap.ip!=null||/^ip[- ]?адрес/i.test(String(first[0]||""));
  const dataLines=hasHeader?lines.slice(1):lines;
  const map=hasHeader?colMap:null;
  return dataLines.map((line,i)=>csvRowFrom(splitCsvLine(line),i+1,map));
}

    wizd.ipPhase="search";wizd.foundServerId=null;wizd.searchMsg=r.msg;toast(r.msg);wd();return;
  }
  wizd.ipPhase="found";wizd.foundServerId=r.server.id;wizd.searchMsg=null;wd();
}
function needsParent(type){
  return["sensor","relay","mic","acfa_sensor","acfa_lock","acfa_fence"].includes(type);
}
function parentOpts(s,type){
  const out=[],acfaMode=wizd.view==="acfa";
  walk(d=>{
    if(["acfa_sensor","acfa_lock","acfa_fence"].includes(type)&&d.type==="acfa")out.push(d);
    else if(type==="relay"&&acfaMode&&(d.type==="acfa"||d.type==="acfa_lock"))out.push(d);
    else if(["sensor","relay","mic"].includes(type)&&!acfaMode&&(d.type==="camera"||d.type==="channel"||(d.type==="ipsrv"&&d.subtype!=="nvr")))out.push(d);
  },s?.devices||[],s);
  return out;
}
function wizardTitle(){
  if(wizd.mode==="device-add")return"Добавить устройство";
  if(wizd.mode==="server-manual")return"Найти сервер";
  if(wizd.serverOnly)return"Добавить сервер";
  if(wizd.view==="acfa")return"Добавить ACFA";
  if(wizd.view==="sys"||wizd.cat==="svc")return"Добавить службу";
  return"Добавить устройство";
}
function wizardServerOptions(){
  const c=addContext(),list=allocatedServers(c.domain?.id);
  if(!wizd.server||!list.some(s=>s.id===wizd.server))wizd.server=list[0]?.id||null;
  return list;
}
function wd(){
  if(wizd.mode==="device-add"){renderDeviceWizard();return}
  const serverList=wizd.mode==="server-list";
  const serverFlow=serverList||wizd.mode==="server-manual";
  document.getElementById("wizDr").classList.remove("device-wizard");
  document.getElementById("wizDr").classList.toggle("server-list",!!serverList);
  const df=document.querySelector("#wiz .df"),foot=document.getElementById("wizFoot");
  if(df)df.classList.remove("device-footer");
  if(foot)foot.innerHTML="";
  document.querySelector("#wiz .df").style.display=serverList?"none":"";
  document.getElementById("wst").innerHTML=serverFlow?"":[1,2].map(i=>`<div class="stp ${i<=ws?"on":""}"></div>`).join("");
  document.getElementById("wst").style.display=serverFlow?"none":"";
  const manualSearch=wizd.mode==="server-manual"&&wizd.ipPhase==="search";
  const manualFound=wizd.mode==="server-manual"&&wizd.ipPhase==="found";
  const hideBack=serverList||(ws===1&&!manualFound);
  const wb=document.getElementById("wb"),wn=document.getElementById("wn");
  wb.style.display=hideBack?"none":"";
  wb.disabled=hideBack;
  wn.style.display=serverList?"none":"";
  document.getElementById("wizT").textContent=wizardTitle();
  wn.textContent=manualSearch?"Найти":manualFound?"Добавить в домен":ws===2?"Добавить":"Далее";
  let h="";
  if(serverList){
    const did=wizd.domain||domains[0]?.id;
    h+=`<div class="srv-wrap">
      <div class="wiz-unalloc-hd">
        <div class="wsec">Найденные нераспределённые серверы</div>
        <button type="button" class="ch-act" title="Обновить список" onclick="refreshUnallocInWizard('${did}')"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.2 8a5.2 5.2 0 1 1-1.3-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12.2 2.4v3.2h-3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Обновить</button>
      </div>
      ${unallocServersHtml(did,true)}
    </div>`;
  }else if(ws===1){
    h+=`<div class="wsec">Тип объекта</div>`;
    Object.entries(WIZ).forEach(([cat,blk])=>{
      if(blk.view!==wizd.view||(wizd.lockedCat&&wizd.lockedCat!==cat))return;
      h+=`<div style="margin-bottom:10px"><b style="font-size:12px;color:var(--mu)">${blk.label}</b>
        <div class="g" style="margin-top:6px">${blk.types.map(([id,n,d])=>`<button type="button" class="chc ${wizd.mode==="object"&&wizd.type===id?"on":""}" onclick="chooseAdd('object','${cat}','${id}')"><b>${n}</b><small>${d}</small></button>`).join("")}</div></div>`;
    });
    if(!wizd.mode)h+=`<p class="sub">Выберите, что нужно добавить.</p>`;
  }else if(wizd.mode==="server-manual"){
    if(wizd.ipPhase==="found"){
      const s=servers.find(x=>x.id===wizd.foundServerId);
      const domName=domains.find(d=>d.id===wizd.domain)?.name||"—";
      h+=`<div class="nt ok">Сервер найден в сети</div>
        <div class="it" style="margin-bottom:12px"><span>${ic("server")}</span><span style="flex:1;min-width:0">${s?.name||"—"}<small>${s?.ip||""}${s?.port?":"+s.port:""}</small></span></div>
        <p class="sub" style="margin:0">Будет добавлен в «${escHtml(domName)}».</p>`;
    }else{
      h+=`<p class="sub" style="margin:0 0 10px">Укажите IP-адрес сервера для поиска в сети.</p>
        <div class="g">
        <div><label>IP-адрес</label><input id="wizIp" value="${escHtml(wizd.searchIp||"")}" placeholder="10.30.0.12"></div>
        <div><label>Порт</label><input id="wizPort" type="number" value="${wizd.searchPort||20111}"></div>
      </div>${wizd.searchMsg?`<div class="nt err">${escHtml(wizd.searchMsg)}</div>`:""}`;
    }
  }else{
    const list=wizardServerOptions(),s=list.find(x=>x.id===wizd.server),label=WIZ[wizd.cat]?.types.find(t=>t[0]===wizd.type)?.[1]||"Объект";
    h+=`<div class="wsec">Куда добавить</div>`;
    if(!list.length)h+=`<div class="nt">Сначала добавьте сервер в домен.</div>`;
    else{
      h+=`<div class="g"><div><label>Сервер</label><select id="wizServer" onchange="wizd.server=this.value;wizd.parentId=null;wd()">
        ${list.map(x=>`<option value="${x.id}" ${x.id===wizd.server?"selected":""}>${x.name} · ${x.ip||"без IP"}</option>`).join("")}</select></div>`;
      if(needsParent(wizd.type)){
        const opts=parentOpts(s,wizd.type);
        if(!wizd.parentId||!opts.some(o=>o.id===wizd.parentId))wizd.parentId=opts[0]?.id||null;
        h+=`<div><label>Родительский объект</label><select id="wizParent" onchange="wizd.parentId=this.value">
          ${opts.length?opts.map(o=>`<option value="${o.id}" ${o.id===wizd.parentId?"selected":""}>${o.name} (${LB[o.type]})</option>`).join(""):`<option value="">Нет подходящих объектов</option>`}</select></div>`;
      }
      h+=`</div><div class="wsec">Параметры: ${label}</div><div class="g">
        <div><label>Имя</label><input id="wizName" value="Новый ${label.toLowerCase()}"></div>
        ${["camera","ipsrv-nvr","ipsrv-io","ipsrv-sip","ipsrv-mic","eventsrc","acfa"].includes(wizd.type)?`<div><label>IP-адрес</label><input id="wizObjIp" value="192.168.1.50"></div>`:""}
        ${wizd.type==="export"?`<div><label>Папка</label><input id="wizPath" value="D:\\Export"></div>`:""}
        ${wizd.type==="email"?`<div><label>SMTP</label><input id="wizSmtp" value=""></div>`:""}
        ${needsParent(wizd.type)&&wizd.view==="cam"?`<div><label>Канал</label><input id="wizChannel" type="number" value="1"></div>`:""}
      </div>`;
    }
  }
  document.getElementById("wbd").innerHTML=h;
}
function wnx(){
  if(wizd.mode==="device-add")return;
  if(ws===1){
    if(!wizd.mode){toast("Выберите, что нужно добавить");return}
    ws=2;wd();return;
  }
  if(wizd.mode==="server-manual"){
    if(wizd.ipPhase==="found"){
      const id=wizd.foundServerId;
      if(!id){toast("Сервер не найден");return}
      document.getElementById("wiz").classList.remove("open");
      addToDomain(id,wizd.domain);return;
    }
    runIpSearch();return;
  }
  const s=domains.flatMap(d=>d.servers).find(x=>x.id===wizd.server);
  if(!s){toast("Выберите сервер");return}
  if(needsParent(wizd.type)&&!wizd.parentId){toast("Нет подходящего родительского объекта");return}
  const rawType=wizd.type,type=rawType.startsWith("ipsrv-")?"ipsrv":rawType,subtype=rawType.startsWith("ipsrv-")?rawType.slice(6):null;
  const name=(document.getElementById("wizName")||{}).value?.trim()||"Новый объект";
  const id="obj"+Date.now(),node={id,type,name,online:true,devices:[]};
  if(subtype)node.subtype=subtype;
  const ip=(document.getElementById("wizObjIp")||{}).value?.trim();if(ip)node.ip=ip;
  const ch=(document.getElementById("wizChannel")||{}).value;if(ch!=="undefined"&&ch!=null&&ch!=="")node.ch=+ch;
  if(rawType==="export")node.path=(document.getElementById("wizPath")||{}).value||"D:\\Export";
  if(rawType==="email")node.smtp=(document.getElementById("wizSmtp")||{}).value||"";
  if(rawType==="spk")node.server=true;
  const parent=wizd.parentId?find(wizd.parentId)?.n:s;
  (parent.devices||(parent.devices=[])).push(node);
  if(rawType==="acfa"||ACFA_NODE_IDS.has(parent.id))ACFA_NODE_IDS.add(id);
  open.add(parent.id);sel=id;tab="gen";treeMatchCache.clear();searchMatchCache.clear();
  document.getElementById("wiz").classList.remove("open");toast(name+" добавлен");paint();
}
function paint(){if(!document.querySelector("#rail .rail-tabs"))renderRail();else syncRail();if(_lastApp!==app){aside();_lastApp=app}else renderTree();
  const ui={gear:gear,groups:groupsUI,dets:detsUI,rec:recUI,rules:rulesUI,acc:accUI,sys:sysUI,log:logUI};
  (ui[app]||gear)();
  if(app!=="gear")syncDomAct();
  syncHeaderLoad();
}
function upd(){paint()}
const rsz=document.getElementById("rsz");let drag=false;
rsz.onmousedown=e=>{drag=true;rsz.classList.add("on");e.preventDefault()};
window.onmousemove=e=>{if(!drag)return;const left=railOffsetX();asideW=Math.max(300,Math.min(600,e.clientX-left));document.getElementById("ws").style.setProperty("--aw",asideW+"px");if(filtPop)placeFiltPop()};
window.onmouseup=()=>{drag=false;rsz.classList.remove("on")};
document.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();openJump()}
  if(document.getElementById("confirm")?.classList.contains("open")){
    if(e.key==="Escape"){e.preventDefault();closeConfirm();return}
    if(e.key==="Enter"){e.preventDefault();runConfirmOk();return}
  }
  if(e.key==="Escape"){closeJump();closeTreeCtx();if(treeSel.size>1){clearTreeSel()}}
  if((e.key==="Delete"||e.key==="Backspace")&&treeSel.size>1&&app==="gear"&&!e.target.closest("input,textarea,select")){e.preventDefault();deleteSelected()}};
document.addEventListener("mousedown",e=>{if(!e.target.closest("#tctx"))closeTreeCtx()});
syncLocalePack();applyStaticUi();
if(!applyDeepLink()){resetTreeSel(sel);paint();}
</script>
